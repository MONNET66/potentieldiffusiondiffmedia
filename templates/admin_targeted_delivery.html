

<div class="container" style="max-width:900px;margin:40px auto;">

    <h1>🎯 Livraison ciblée</h1>

    <p style="margin-bottom:25px;color:#666;">
        Modifier les tarifs des campagnes ciblées.
    </p>

    <form method="POST">

        <table class="table" style="width:100%;border-collapse:collapse;">

            <thead>
                <tr>
                    <th style="text-align:left;">Clé tarifaire</th>
                    <th style="text-align:left;">Règle</th>
                    <th style="width:180px;">Prix HT (€)</th>
                </tr>
            </thead>

            <tbody>

            {% for price in prices %}

                <tr>

                    <td>
                        {{ price["pricing_key"] }}
                    </td>

                    <td>
                        {{ price["billing_rule"] or "-" }}
                    </td>

                    <td>

                        <input
                            type="number"
                            step="0.01"
                            name="price_{{ price['id'] }}"
                            value="{{ "%.2f"|format(price['price_ht']) }}"
                            style="width:120px;padding:6px;"
                        >

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

        <div style="margin-top:30px;display:flex;gap:15px;">

            <button
                type="submit"
                class="action-button secondary"
            >
                💾 Enregistrer
            </button>

            <a
                href="{{ url_for('admin_pricing') }}"
                class="action-button"
            >
                ← Retour
            </a>

        </div>

    </form>

</div>

{% endblock %}
